services:
  glyphhold:
    image: ghcr.io/dosk3n/glyphhold:2.2.0
    ports:
      - "127.0.0.1:5995:5995"
    volumes:
      - glyphhold2-data:/data
    environment:
      GLYPHHOLD_DB_PATH: /data/glyphhold.sqlite
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5995/api/v1/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  glyphhold2-data:
