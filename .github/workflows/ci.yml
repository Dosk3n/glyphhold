name: CI

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Build dashboard
        working-directory: dashboard-ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-build.lock
          pip install --no-build-isolation --no-deps -e .
          pip install httpx pytest ruff
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit

      - name: Run ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-checks, python-checks]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build Docker image
        run: docker build -t glyphhold:ci .

      - name: Smoke import and migrations
        run: |
          docker run --rm \
            -e GLYPHHOLD_DB_PATH=/tmp/glyphhold-ci.sqlite \
            glyphhold:ci \
            python -c "from app.storage.migrations import apply_migrations,current_schema_version; apply_migrations(); assert current_schema_version() >= 6"

      - name: Smoke bundled CLI entrypoints
        run: |
          docker run --rm --entrypoint codex glyphhold:ci --version
          docker run --rm -e BITWARDENCLI_APPDATA_DIR=/tmp/bw --entrypoint bw glyphhold:ci --version

      - name: Audit exact final image Python and bundled CLI dependencies
        timeout-minutes: 5
        run: python scripts/gh2_supply_chain_audit.py glyphhold:ci
