# Include the zones in nginx's http {} context, not inside server {}.
limit_req_zone $binary_remote_addr zone=glyphhold_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=glyphhold_connections:10m;

# Adapt certificate paths, hostname, upstream addresses and your Authelia portal.
server {
    listen 443 ssl;
    server_name glyphhold.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_conn glyphhold_connections 20;

    # Trust forwarded addresses only from your actual upstream proxy addresses.
    # Never configure set_real_ip_from 0.0.0.0/0 or wildcard ASGI forwarded-IP trust.

    location = /internal/authelia {
        internal;
        proxy_pass http://authelia:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Publicly reachable API still requires a valid Glyph Hold bearer key.
    # Health is the intentionally unauthenticated exception; dashboard APIs are not here.
    location ^~ /api/ {
        auth_request off;
        limit_req zone=glyphhold_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://glyphhold:5995;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Protect all dashboard APIs, setup/login, assets and optional docs/schema paths.
    location / {
        auth_request /internal/authelia;
        error_page 401 =302 https://auth.example.com/?rd=https://glyphhold.example.com;
        proxy_pass http://glyphhold:5995;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
